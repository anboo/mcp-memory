services:
  memory-pg:
    image: pgvector/pgvector:pg16
    container_name: opencode-memory-pg
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      - "5434:5432"
    volumes:
      - memory_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  memory_pg_data: